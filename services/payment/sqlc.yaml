version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/repository/postgres/queries.sql
    gen:
      go:
        package: postgres
        out: internal/repository/postgres
        sql_package: pgx/v5
        output_files_suffix: _gen
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
