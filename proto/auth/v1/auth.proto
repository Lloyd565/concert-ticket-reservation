syntax = "proto3";

// Auth service contract. Internal only: clients reach these operations as REST
// through the gateway, which translates. Field numbers are never reused or
// renumbered (AGENTS.md §5).
package auth.v1;

option go_package = "github.com/lloyd565/concert-ticket-reservation/proto/auth/v1;authv1";

// Role is the authorization level carried in the access token's `role` claim.
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_ATTENDEE = 1;
  ROLE_ORGANIZER = 2;
  ROLE_ADMIN = 3;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  // Optional; defaults to ROLE_ATTENDEE. Only an admin caller may set anything
  // else, which the gateway enforces before the call reaches here.
  Role role = 3;
}

message RegisterResponse {
  string user_id = 1;
  string email = 2;
  Role role = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

// TokenPair is what every credential-granting call returns. The refresh token
// is opaque to the gateway: only Auth can validate it, because only Auth has
// the table it is checked against.
message TokenPair {
  string access_token = 1;
  string refresh_token = 2;
  // Seconds until access_token expires, so a client can schedule its refresh
  // without parsing the JWT.
  int64 expires_in = 3;
  string user_id = 4;
  Role role = 5;
}

message RefreshRequest {
  string refresh_token = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {
  // True when this call revoked a live token; false when it was already
  // revoked or expired. Logout is idempotent either way (AGENTS.md §2 rule 10).
  bool revoked = 1;
}

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (TokenPair);
  rpc Refresh(RefreshRequest) returns (TokenPair);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
}
