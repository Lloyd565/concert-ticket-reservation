syntax = "proto3";

// Payment service contract (P2). Booking is the only caller: it is the saga
// orchestrator, and this is the one synchronous service-to-service hop in the
// system (ARCHITECTURE.md §4.1).
package payment.v1;

option go_package = "github.com/lloyd565/concert-ticket-reservation/proto/payment/v1;paymentv1";

// ChargeStatus mirrors the domain state machine. PENDING is not a transient
// implementation detail: it is the durable record that a charge was started,
// written before the provider is called so an in-flight charge survives a
// crash (FR-4.5). A caller that sees PENDING has an unknown outcome, not a
// failed one.
enum ChargeStatus {
  CHARGE_STATUS_UNSPECIFIED = 0;
  CHARGE_STATUS_PENDING = 1;
  CHARGE_STATUS_SUCCEEDED = 2;
  CHARGE_STATUS_DECLINED = 3;
  CHARGE_STATUS_FAILED = 4;
}

enum RefundStatus {
  REFUND_STATUS_UNSPECIFIED = 0;
  REFUND_STATUS_PENDING = 1;
  REFUND_STATUS_SUCCEEDED = 2;
  REFUND_STATUS_FAILED = 3;
}

message Charge {
  string id = 1;
  string reservation_id = 2;
  string user_id = 3;
  int64 amount_cents = 4;
  ChargeStatus status = 5;
  string provider_ref = 6;
  string idempotency_key = 7;
  // Populated on DECLINED so the caller can tell the customer why.
  string decline_reason = 8;
}

message Refund {
  string id = 1;
  string charge_id = 2;
  int64 amount_cents = 3;
  RefundStatus status = 4;
  string provider_ref = 5;
  string idempotency_key = 6;
}

message ChargeRequest {
  string reservation_id = 1;
  string user_id = 2;
  // Money is integer cents everywhere. Never a float (AGENTS.md §5).
  int64 amount_cents = 3;
  // Required (FR-4.3). Replaying a key returns the original charge rather than
  // taking the money twice.
  string idempotency_key = 4;
}

message ChargeResponse {
  Charge charge = 1;
}

// GetChargeRequest is what makes the saga's unknown-outcome case converge: the
// reconciliation job asks "what happened to the charge under this key?" and
// gets a definite answer, or PENDING meaning ask again (D8).
message GetChargeRequest {
  string idempotency_key = 1;
}

message GetChargeResponse {
  Charge charge = 1;
}

message RefundRequest {
  string charge_id = 1;
  int64 amount_cents = 2;
  // Required (FR-4.6). A refund is as dangerous to repeat as a charge.
  string idempotency_key = 3;
}

message RefundResponse {
  Refund refund = 1;
}

service PaymentService {
  rpc Charge(ChargeRequest) returns (ChargeResponse);
  rpc GetCharge(GetChargeRequest) returns (GetChargeResponse);
  rpc Refund(RefundRequest) returns (RefundResponse);
}
